name: Gyaani AI Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Gateway Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gateway-service:latest
            ${{ secrets.DOCKER_USERNAME }}/gateway-service:${{ github.sha }}

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/auth/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
            ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.sha }}

      - name: Build and Push Chat Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/chat/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chat-service:latest
            ${{ secrets.DOCKER_USERNAME }}/chat-service:${{ github.sha }}

      - name: Build and Push Agent Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/agent/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/agent-service:latest
            ${{ secrets.DOCKER_USERNAME }}/agent-service:${{ github.sha }}

      - name: Build and Push Billing Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/billing/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/billing-service:latest
            ${{ secrets.DOCKER_USERNAME }}/billing-service:${{ github.sha }}
